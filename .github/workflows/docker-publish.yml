name: Docker

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      rebuild_release:
        description: Rebuild the latest release and move its tags, as the monthly schedule does
        type: boolean
        default: false
  # Monthly rebuild of the latest release, so its tags (e.g. :3) pick up base image security fixes.
  schedule:
    - cron: "0 2 1 * *"

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  # What to build: the triggering ref, or on the monthly schedule (or a manual run with rebuild_release) the latest
  # release tag.
  release:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.resolve.outputs.rebuild }}
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'schedule' || inputs.rebuild_release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the ref to build
        id: resolve
        env:
          REBUILD: ${{ github.event_name == 'schedule' || inputs.rebuild_release == true }}
        run: |
          echo "rebuild=$REBUILD" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" != "true" ]; then
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Stable releases only (vX.Y.Z), newest version first.
          tag=$(git tag --list 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$tag" ]; then
            echo "No release tag found" >&2
            exit 1
          fi
          echo "Rebuilding release $tag"
          {
            echo "ref=refs/tags/$tag"
            echo "tag=$tag"
            echo "sha=$(git rev-list -n 1 "$tag")"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src

      - name: Build
        run: dotnet build src --no-restore

      # Unit, adapter and integration tests (the latter start Mosquitto with Testcontainers).
      # Fails when line coverage drops below the gates in src/Directory.Build.props.
      - name: Run tests with coverage gates
        run: dotnet test src --no-build --verbosity normal /p:CollectCoverage=true

      - name: Coverage summary
        if: always()
        run: |
          echo "## Line coverage" >> $GITHUB_STEP_SUMMARY
          for report in src/*/TestResults/coverage.cobertura.xml; do
            [ -f "$report" ] || continue
            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$report" | grep -o '[0-9.]*')
            echo "- $(basename "$(dirname "$(dirname "$report")")"): $(awk "BEGIN { printf \"%.1f%%\", $rate * 100 }")" >> $GITHUB_STEP_SUMMARY
          done

  build:
    needs: [ release, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      security-events: write # For Trivy scan results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.4.1'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      # The monthly schedule (or a manual rebuild_release run) rebuilds the latest release: it moves only that
      # release's semver tags (e.g. :3, :3.0, :3.0.4), not latest, main or sha-*, which describe the main branch.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.release.outputs.rebuild != 'true' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ needs.release.outputs.rebuild != 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.rebuild == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.rebuild == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.rebuild == 'true' }}
            type=sha,enable=${{ needs.release.outputs.rebuild != 'true' }}
          # On a release rebuild the event's commit is main, not the release being rebuilt.
          labels: |
            ${{ needs.release.outputs.rebuild == 'true' && format('org.opencontainers.image.revision={0}', needs.release.outputs.sha) || '' }}

      # Release builds report the tag's version (v3.0.4 -> 3.0.4); other builds a development version with the
      # commit, so the image never claims a stale release number.
      - name: Determine the application version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add build provenance and SBOM
          provenance: true
          sbom: true

      # Run Trivy vulnerability scanner (no image is pushed on PRs, so skip there)
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Add build summary
      - name: Generate build summary
        if: always()
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-and-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
