name: dotnet-format check

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run dotnet format (verify no changes)
        run: |
          dotnet format src/SbmFizikusToMqtt.slnx --verify-no-changes || (
            echo "Formatting issues detected. Run 'dotnet format src/SbmFizikusToMqtt.slnx' locally to fix.";
            exit 1
          )
